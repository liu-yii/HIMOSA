# network structures
network_g:
  type: HIMOSAv1
  upscale: 4
  in_chans: 3
  img_size: 64
  embed_dim: 60
  depths: [6, 6, 6, 6, ]
  num_heads: [6, 6, 6, 6, ]
  mosa_heads: [8, 8, 8, 8]
  sparsity: [1, 1, 2, 4, 8, 12]
  base_win_size: [8, 8]
  reducted_dim: 8
  convffn_kernel_size: 7
  img_range: 1.
  mlp_ratio: 1
  upsampler: 'pixelshuffledirect'
  resi_connection: '1conv'
  use_checkpoint: false
  hier_win_ratios: [0.5,1,2,4,6,8]

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  param_key_g: params_ema
  results_root: ~

# validation settings
val:
  save_img: true
  suffix: ~  # add suffix to saved images, if None, use exp name

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true
    # niqe:
    #   type: calculate_niqe
    #   crop_border: 4
    #   test_y_channel: true